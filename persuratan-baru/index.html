<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk ke Kampusly | TSU</title>
<style>
  :root {
    --forest: #2E9E68;
    --forest-dark: #1F7A4D;
    --dark-bg: #0F1A15;
    --dark-surface: #18261F;
    --dark-line: #2A3A32;
    --cream: #F1EFE9;
    --ink: #EDF2EE;
    --ink-soft: #93A39A;
    --amber: #F2A93B;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  /* ============================================================
     KEYFRAMES
     ============================================================ */
  @keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 22px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes floatUp {
    0%   { transform: translate3d(0, 0, 0) scale(.5);      opacity: 0; }
    12%  { opacity: .85; }
    85%  { opacity: .35; }
    100% { transform: translate3d(40px, -110vh, 0) scale(1.15); opacity: 0; }
  }
  @keyframes growLine {
    from { width: 0;    opacity: 0; }
    to   { width: 64px; opacity: 1; }
  }
  @keyframes lineGrow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(46,158,104,.45); }
    70%  { box-shadow: 0 0 0 12px rgba(46,158,104,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,158,104,0); }
  }
  @keyframes shine {
    0%   { transform: translateX(-160%) skewX(-20deg); }
    55%  { transform: translateX(340%)  skewX(-20deg); }
    100% { transform: translateX(340%)  skewX(-20deg); }
  }
  @keyframes rippleAnim {
    to { transform: scale(2.6); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0) scale(1); }
    30%      { transform: rotate(-9deg) scale(1.12); }
    65%      { transform: rotate(9deg)  scale(1.12); }
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--dark-bg);
    color: var(--ink);
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: stretch;
  }

  /* ---------- LEFT: Video Panel ---------- */
  .story {
    flex: 1.8;
    position: relative;
    overflow: hidden;
    display: none;
  }

  @media (min-width: 900px) {
    .story {
      display: flex;
      flex-direction: column;
      animation: fadeIn 1.1s ease both;
    }
  }

  .story-photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    z-index: 0;
    will-change: transform;
  }

  .story-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(15,26,21,0.55) 0%,
      rgba(15,26,21,0.15) 40%,
      rgba(15,26,21,0.55) 100%);
    z-index: 1;
  }

  /* Transisi ke warna gelap */
  .story::after {
    content: "";
    position: absolute;
    top: 0;
    right: -1px;
    bottom: 0;
    width: 180px;
    background: linear-gradient(90deg, transparent, var(--dark-bg));
    z-index: 4;
    pointer-events: none;
  }

  .particles {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  .particles span {
    position: absolute;
    bottom: -12%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    filter: blur(0.4px);
    animation: floatUp linear infinite;
    will-change: transform, opacity;
  }
  .particles span:nth-child(1) { left: 8%;  width: 6px;  height: 6px;  animation-duration: 15s; animation-delay: 0s;    }
  .particles span:nth-child(2) { left: 24%; width: 10px; height: 10px; background: rgba(242,169,59,.55); animation-duration: 19s; animation-delay: 2.5s; }
  .particles span:nth-child(3) { left: 41%; width: 5px;  height: 5px;  animation-duration: 13s; animation-delay: 5s;    }
  .particles span:nth-child(4) { left: 58%; width: 9px;  height: 9px;  background: rgba(160,220,180,.6);  animation-duration: 21s; animation-delay: 1.2s; }
  .particles span:nth-child(5) { left: 76%; width: 6px;  height: 6px;  animation-duration: 17s; animation-delay: 7s;    }
  .particles span:nth-child(6) { left: 90%; width: 12px; height: 12px; background: rgba(255,255,255,.35); animation-duration: 23s; animation-delay: 3.6s; }

  .story h1 {
    position: relative;
    z-index: 3;
    font-size: clamp(28px, 3vw, 38px);
    line-height: 1.25;
    max-width: 380px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    margin: 56px 0 0 48px;
    animation: fadeUp .9s var(--ease-out) .35s both;
  }
  .story h1::after {
    content: "";
    display: block;
    height: 3px;
    width: 0;
    margin-top: 22px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--amber), rgba(242,169,59,0));
    animation: growLine .9s var(--ease-out) .95s both;
  }

  /* ---------- RIGHT: Auth Panel (GELAP) ---------- */
  .auth {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    z-index: 5;
    background: var(--dark-bg);
  }

  .auth-card {
    width: 100%;
    max-width: 360px;
  }

  .brand, h2, .sso-row, .divider, .field,
  .row-between, .btn-primary, .signup, .terms, .copyright {
    animation: fadeUp .7s var(--ease-out) both;
  }

  .brand      { animation-delay: .05s; }
  h2          { animation-delay: .15s; }
  .sso-row    { animation-delay: .25s; }
  .divider    { animation-delay: .35s; }
  .field:nth-child(1) { animation-delay: .45s; }
  .field:nth-child(2) { animation-delay: .55s; }
  .row-between{ animation-delay: .65s; }
  .btn-primary{ animation-delay: .75s; }
  .signup     { animation-delay: .85s; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-mark {
    position: relative;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--forest);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s var(--ease-out), background .25s ease;
  }
  .brand-mark:hover { transform: rotate(-6deg) scale(1.06); }
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 9px;
    animation: pulseRing 2.8s ease-out infinite;
  }
  .brand-mark svg { width: 18px; height: 18px; }

  .brand-name {
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
  }

  h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 22px 0;
    color: var(--ink);
  }

  .sso-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .sso-row .sso-btn {
    flex: 0 0 auto;
    min-width: 160px;
  }

  .sso-btn {
    position: relative;
    overflow: hidden;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 10px;
    border: 1px solid var(--dark-line);
    border-radius: 10px;
    background: var(--dark-surface);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .2s ease, box-shadow .25s ease, transform .12s ease, background .2s ease;
  }
  .sso-btn:hover {
    border-color: var(--forest);
    background: #1E2E26;
    box-shadow: 0 6px 16px -8px rgba(46,158,104,.5);
    transform: translateY(-1px);
  }
  .sso-btn:active { transform: scale(0.98); }
  .sso-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sso-btn:hover svg { animation: wiggle .55s ease; }
  .sso-btn .ripple { background: rgba(46,158,104,.22); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 22px 0;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--dark-line);
    transform: scaleX(0);
    animation: lineGrow .9s var(--ease-out) .55s forwards;
  }
  .divider::before { transform-origin: right center; }
  .divider::after  { transform-origin: left center;  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 6px;
    transition: color .2s ease, transform .2s ease;
  }

  .field { margin-bottom: 16px; }
  .field:focus-within label {
    color: var(--forest);
    transform: translateX(2px);
  }

  .input-wrap { position: relative; }

  .input-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--ink-soft);
    transition: color .2s ease, transform .25s var(--ease-out);
    pointer-events: none;
  }
  .input-wrap:focus-within svg {
    color: var(--forest);
    transform: translateY(-50%) scale(1.15);
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px 12px 38px;
    border: 1px solid var(--dark-line);
    border-radius: 10px;
    font-size: 14px;
    background: var(--dark-surface);
    color: var(--ink);
    outline: none;
    transition: border-color .2s ease, box-shadow .25s ease, background .2s ease;
  }

  input::placeholder { color: #6E7D75; transition: opacity .2s ease, transform .2s ease; }
  input:focus::placeholder { opacity: .55; }

  input:focus {
    border-color: var(--forest);
    box-shadow: 0 0 0 3px rgba(46, 158, 104, 0.22);
    background: #1E2E26;
  }

  .row-between {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 22px;
  }

  .link {
    position: relative;
    font-size: 13px;
    color: var(--forest);
    text-decoration: none;
    font-weight: 500;
    transition: color .2s ease;
  }
  .link::after {
    content: "";
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform .3s var(--ease-out);
  }
  .link:hover::after {
    transform: scaleX(1);
    transform-origin: left center;
  }
  .link:hover { color: #4CC98A; }

  .btn-primary {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--forest);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .2s ease, transform .12s ease, box-shadow .25s ease;
  }
  .btn-primary:hover {
    background: #3CB878;
    box-shadow: 0 10px 22px -12px rgba(46, 158, 104, .9);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: scale(0.99); }

  .btn-primary::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 40%;
    height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.25), transparent);
    transform: translateX(-160%) skewX(-20deg);
    animation: shine 4s ease-in-out infinite;
    pointer-events: none;
  }

  .btn-label { transition: opacity .2s ease; }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff;
  }
  .btn-primary.loading { pointer-events: none; }
  .btn-primary.loading .spinner {
    display: block;
    animation: spin .7s linear infinite;
  }
  .btn-primary.loading .btn-label { opacity: .75; }

  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.4);
    transform: scale(0);
    animation: rippleAnim .65s ease-out forwards;
    pointer-events: none;
  }

  .signup {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 20px;
  }
  .signup a {
    position: relative;
    color: var(--forest);
    font-weight: 600;
    text-decoration: none;
  }
  .signup a::after {
    content: "";
    position: absolute;
    left: 0; bottom: -2px;
    width: 100%; height: 1.5px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right center;
    transition: transform .3s var(--ease-out);
  }
  .signup a:hover::after {
    transform: scaleX(1);
    transform-origin: left center;
  }
  .signup a:hover { color: #4CC98A; }

  .terms {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 14px;
    line-height: 1.5;
  }
  .terms a { color: var(--ink-soft); text-decoration: underline; }

  .copyright {
    text-align: center;
    font-size: 11px;
    color: #4E5C55;
    margin-top: 26px;
  }

  .login-message {
    display: none;
    margin: 0 0 14px;
    padding: 10px 12px;
    border: 1px solid rgba(239, 68, 68, .35);
    border-radius: 8px;
    background: rgba(239, 68, 68, .09);
    color: #ff9b9b;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .login-message.show { display: block; }
  .login-message.success {
    border-color: rgba(46, 158, 104, .4);
    background: rgba(46, 158, 104, .1);
    color: #7de0ad;
  }
  .demo-account {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--dark-line);
    border-radius: 9px;
    background: rgba(255,255,255,.025);
    font-size: 12px;
  }
  .demo-account strong { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="page">

    <!-- LEFT PANEL -->
    <div class="story">
      <video class="story-photo" autoplay loop muted playsinline>
        <source src="vidssave.com%20MINI%20COMPRO%20TSU%201080P.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
      </video>
      
      <div class="story-overlay"></div>

      <div class="particles" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <h1>Belajar lebih dekat, kampus dalam genggaman.</h1>
    </div>

    <!-- RIGHT PANEL -->
    <div class="auth">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <span class="brand-name">Kampusly</span>
        </div>

        <h2>Masuk ke akunmu</h2>

        <div class="sso-row">
          <button class="sso-btn" type="button">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.4 29.4 35.5 24 35.5 16.5 35.5 10.5 29.5 10.5 22S16.5 8.5 24 8.5c3.6 0 6.8 1.4 9.3 3.6l5.7-5.7C35.6 3 30.1 1 24 1 11.8 1 2 10.8 2 23s9.8 22 22 22c11.3 0 21-8.2 21-22 0-1.5-.2-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 19 12.5 24 12.5c3.6 0 6.8 1.4 9.3 3.6l5.7-5.7C35.6 6.5 30.1 4.5 24 4.5c-7.4 0-13.8 4.1-17.1 10.2z"/><path fill="#4CAF50" d="M24 44.5c6 0 11.3-2 15-5.6l-6.9-5.7c-2 1.5-4.7 2.3-8.1 2.3-5.3 0-9.8-3.6-11.3-8.5l-6.7 5.2C9.2 39.8 16 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.9 2.9-2.9 5.1-5.4 6.7l6.9 5.7C41 37.5 44 30.9 44 23c0-1.5-.2-2.5-.4-2.5z"/></svg>
            Google
          </button>
        </div>

        <div class="divider">atau</div>

        <p id="loginMessage" class="login-message" role="alert" aria-live="polite"></p>

        <form novalidate>
          <div class="field">
            <label for="email">Alamat email</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
              <input type="email" id="email" placeholder="nama@contoh.com" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label for="password">Kata sandi</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <input type="password" id="password" placeholder="Masukkan kata sandi" autocomplete="current-password">
            </div>
          </div>

          <div class="row-between">
            <a href="#" class="link">Lupa kata sandi?</a>
          </div>

          <button class="btn-primary" type="submit">
            <span class="btn-label">Masuk</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="signup">Akun tunggal untuk prototipe demo ini.</p>
        <p class="terms demo-account">Akun demo: <strong>admin@tsu.ac.id</strong><br>Kata sandi: <strong>tsu12345</strong></p>

      </div>
    </div>

  </div>

<script>
  (function () {
    const SESSION_KEY = 'kampuslyCurrentUser';
    const DEMO_EMAIL = 'admin@tsu.ac.id';
    const DEMO_PASSWORD = 'tsu12345';
    const form = document.querySelector('form');
    const submitBtn = form.querySelector('.btn-primary');
    const message = document.getElementById('loginMessage');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'login-message show' + (type === 'success' ? ' success' : '');
    }

    // Jika sesi demo masih aktif, langsung buka dashboard.
    try {
      if (sessionStorage.getItem(SESSION_KEY)) {
        window.location.replace('dashboard.html');
        return;
      }
    } catch (error) {
      showMessage('Penyimpanan sesi browser tidak tersedia. Coba buka proyek lewat server lokal.', 'error');
    }

    document.querySelectorAll('.btn-primary, .sso-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        btn.appendChild(ripple);
        setTimeout(function () { ripple.remove(); }, 650);
      });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (submitBtn.classList.contains('loading')) return;

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!email || !password) {
        showMessage('Masukkan alamat email dan kata sandi terlebih dahulu.');
        return;
      }
      if (email !== DEMO_EMAIL || password !== DEMO_PASSWORD) {
        showMessage('Email atau kata sandi salah. Gunakan akun demo yang ditampilkan di bawah form.');
        return;
      }

      submitBtn.classList.add('loading');
      showMessage('Login berhasil. Membuka dashboard...', 'success');
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({
          email: DEMO_EMAIL,
          name: 'Admin TSU'
        }));
      } catch (error) {
        submitBtn.classList.remove('loading');
        showMessage('Sesi tidak dapat disimpan oleh browser. Jalankan lewat localhost atau Live Server.');
        return;
      }

      setTimeout(function () {
        window.location.replace('dashboard.html');
      }, 500);
    });

    document.querySelector('.sso-btn').addEventListener('click', function () {
      showMessage('Login Google belum dihubungkan pada prototipe ini. Gunakan akun demo di bawah form.');
    });
    const forgotLink = document.querySelector('.row-between .link');
    if (forgotLink) forgotLink.addEventListener('click', function (e) {
      e.preventDefault();
      showMessage('Fitur lupa kata sandi belum tersedia pada prototipe demo ini.');
    });
  })();
</script>
</body>
</html>
